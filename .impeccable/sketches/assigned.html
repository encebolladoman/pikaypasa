<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tablero</title>
<style>
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;background:#111;color:#EDE6DA;font-family:Sora,system-ui,sans-serif;overflow:hidden}
.board{position:relative;height:100%;padding:20px 16px;border:3px solid #EDE6DA;margin:0}
.mid{position:absolute;left:0;right:0;top:300px;border-top:3px solid #EDE6DA}
.circle{position:absolute;left:50%;top:300px;width:120px;height:120px;margin:-60px 0 0 -60px;border:3px solid #EDE6DA;border-radius:50%}
.logo{font-family:Anton,Impact,sans-serif;font-size:62px;line-height:1;letter-spacing:.5px}
.logo b{color:#FF6A13;font-weight:400}
.k{font-size:13px;letter-spacing:2px;text-transform:uppercase;margin-top:14px}
.fix{margin-top:18px;display:grid;grid-template-columns:1fr auto;gap:8px 12px;font-weight:800;font-size:24px}
.fix span:nth-child(2n){color:#FF6A13}
.cta{position:absolute;left:16px;right:16px;top:450px;height:64px;background:#FF6A13;color:#111;font-weight:800;font-size:24px;display:flex;align-items:center;justify-content:center}
.table{position:absolute;left:16px;right:16px;top:540px}
.row{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid #EDE6DA;padding:12px 0;font-weight:800;font-size:26px}
.row i{font-style:normal;color:#FF6A13;font-size:34px}
.row.o{color:#111}
</style></head><body>
<div class="board">
<div class="logo">PIKAY<b>PASA</b></div>
<div class="k">Hoy juega · vie sáb dom · 6 a 11 pm</div>
<div class="fix"><span>Local: Renacer</span><span>GRATIS</span><span>Girasoles</span><span>$1</span></div>
<div class="mid"></div><div class="circle"></div>
<div class="cta">VER MENÚ</div>
<div class="table">
<div class="row"><span>Mixto</span><i>7.50</i></div>
<div class="row"><span>Pareja</span><i>8.99</i></div>
<div class="row"><span>Parche ×4</span><i>14.99</i></div>
</div>
</div>
</body></html>
