<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Estándar</title>
<style>
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;background:#111;color:#EDE6DA;font-family:Sora,system-ui,sans-serif;overflow:hidden;padding:24px 16px}
.logo{font-family:Anton,Impact,sans-serif;font-size:56px;line-height:1;text-align:center}
.logo b{color:#FF6A13;font-weight:400}
h1{font-weight:800;font-size:28px;text-align:center;margin-top:20px}
.cta{margin:24px auto 0;height:60px;background:#FF6A13;color:#111;font-weight:800;font-size:22px;display:flex;align-items:center;justify-content:center;border-radius:12px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:32px}
.c{background:#1c1c1c;border-radius:12px;height:200px;padding:12px;display:flex;flex-direction:column;justify-content:flex-end}
.c .img{flex:1;background:#2a2a2a;border-radius:8px;margin-bottom:10px}
.c i{font-style:normal;color:#FF6A13;font-weight:800;font-size:24px}
</style></head><body>
<div class="logo">PIKAY<b>PASA</b></div>
<h1>Boneless, tenders y micheladas</h1>
<div class="cta">Ver menú</div>
<div class="cards">
<div class="c"><div class="img"></div><i>$7.50</i></div>
<div class="c"><div class="img"></div><i>$8.99</i></div>
<div class="c"><div class="img"></div><i>$14.99</i></div>
<div class="c"><div class="img"></div><i>$5.75</i></div>
</div>
</body></html>
