<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ventanilla</title>
<style>
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;background:#111;color:#EDE6DA;font-family:Sora,system-ui,sans-serif;overflow:hidden}
.sign{height:120px;background:#111;display:flex;align-items:center;justify-content:center;border-bottom:6px solid #FF6A13}
.logo{font-family:Anton,Impact,sans-serif;font-size:64px;line-height:1}
.logo b{color:#FF6A13;font-weight:400}
.shutter{height:300px;background:repeating-linear-gradient(#2A2826 0 14px,#1b1a19 14px 18px);display:flex;align-items:flex-end;justify-content:center;padding-bottom:22px}
.tag{background:#EDE6DA;color:#111;font-weight:800;font-size:24px;padding:10px 16px}
.window{background:#EDE6DA;color:#111;height:424px;padding:20px 16px;position:relative}
.window h2{font-weight:800;font-size:30px}
.p{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid #111;padding:12px 0;font-weight:800;font-size:24px}
.p i{font-style:normal;color:#C2410C;font-size:32px}
.cta{position:absolute;left:16px;right:16px;bottom:20px;height:64px;background:#FF6A13;color:#111;font-weight:800;font-size:24px;display:flex;align-items:center;justify-content:center}
</style></head><body>
<div class="sign"><div class="logo">PIKAY<b>PASA</b></div></div>
<div class="shutter"><div class="tag">Abierto · 6 a 11 pm</div></div>
<div class="window"><h2>Combos</h2>
<div class="p"><span>Mixto</span><i>$7.50</i></div>
<div class="p"><span>Combo Pareja</span><i>$8.99</i></div>
<div class="cta">VER MENÚ</div></div>
</body></html>
